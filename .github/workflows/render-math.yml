name: Build and Deploy Notes Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stage chapter pages into docs/
        run: python tools/build_docs.py

      - name: Build site with MkDocs
        run: mkdocs build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # Optional: tell Bing/IndexNow that the pages changed. Never fail the deploy.
      - name: Submit URLs to IndexNow (non-blocking)
        continue-on-error: true
        run: |
          sleep 20
          python3 - <<'PY'
          import json
          import re
          import urllib.request

          KEY = "75dbfddc6a49929b004eae3f66c85192"
          BASE = "https://lg-leo.github.io/IGCSE-Additional-Mathematics-Notes-0606/"
          urls = re.findall(r"<loc>(.*?)</loc>", open("site/sitemap.xml", encoding="utf-8").read())
          if not urls:
              raise SystemExit("no URLs found in sitemap")
          payload = json.dumps({
              "host": "lg-leo.github.io",
              "key": KEY,
              "keyLocation": BASE + f"{KEY}.txt",
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow: submitted {len(urls)} URLs, HTTP {response.status}")
          PY

